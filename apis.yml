aid: flora-fauna
name: FLORA
description: >-
  FLORA is a Brooklyn, New York-based applied AI / HCI company building a
  browser-based "infinite canvas" creative workspace for professional
  creators. Founded in 2024 by Weber Wong out of NYU's Interactive
  Telecommunications Program (ITP), FLORA unifies 50+ third-party text,
  image, and video AI models inside a single node-based visual workspace
  where designers, filmmakers, photographers, and creative agencies wire
  prompts, references, characters, and outputs into reusable generative
  workflows called Techniques. The platform integrates leading image models
  (FLUX.2, FLUX Kontext, Stable Diffusion 3.5, Nano Banana, Recraft,
  Seedream, Minimax Hailuo) and video models (Veo 3, Sora 2, Runway Gen-4
  Turbo / Gen-3 Alpha / Act-Two, Pika, Kling, Luma Ray 2, Seedance, Marey)
  alongside reasoning models such as Gemini 3 Pro and GPT-5.4, and ships a
  creative agent named FAUNA for ideation, iteration, and workflow
  scaffolding. FLORA is used at agencies and studios including Pentagram,
  Milk, and MSCHF; the company raised a $6.5M seed led by Mike Volpi at
  Hanabi Capital with Menlo Ventures, a16z Games Speedrun, Long Journey
  Ventures, Company Ventures, Alumni Ventures, Embedding VC, and angels
  including Justin Kan (Twitch) and Gabe Whaley (MSCHF), and operates
  in-person from the Domino Refinery in Williamsburg. Beyond the canvas
  FLORA now ships a public developer surface: the Flora.ai REST API
  (OpenAPI 3.1.1, base https://app.flora.ai/api/v1) for running Techniques,
  one-off generations, assets, projects, canvas patches and actions
  programmatically; a hosted remote MCP server at https://agents.flora.ai/mcp
  exposing two tools (search_docs, execute) over OAuth 2.1 + PKCE; first-party
  TypeScript and Go SDKs and a Go CLI; signed HMAC-SHA256 run webhooks;
  idempotency keys; and a Stainless-generated developer portal at
  developer.flora.ai. API and MCP access begin on the paid Starter plan.
