apis:
  - aid: flora-fauna:flora-api
    name: Flora.ai API
    description: >-
      The Flora.ai public REST API (v1.6.0) exposes the FLORA creative canvas
      programmatically: discover and run saved Techniques, start one-off model
      generations, list the model catalog, manage workspaces and projects,
      upload assets through signed URLs, read and patch the project canvas as a
      Mermaid graph, and run prebuilt canvas actions. Bearer API-key auth
      (sk_live_ prefix), optional idempotency keys on mutations, and optional
      signed HMAC-SHA256 webhooks on run completion.
    humanURL: https://developer.flora.ai/
    baseURL: https://app.flora.ai/api/v1
    tags:
      - Techniques
      - Technique Runs
      - Generations
