apis:
- aid: flora-fauna:flora-mcp
  name: FLORA MCP Server
  description: >-
    FLORA's hosted remote Model Context Protocol server. Streamable HTTP at https://agents.flora.ai/mcp,
    authenticated with OAuth 2.1 + PKCE (RFC 8414 authorization-server metadata and RFC 9728 protected-resource
    metadata both served). It exposes exactly two tools — search_docs and execute — where execute runs
    a TypeScript snippet against a pre-authenticated @flora-ai/flora SDK client, so the whole REST surface
    is reachable through one tool rather than one tool per endpoint.
  humanURL: https://developer.flora.ai/mcp
  baseURL: https://agents.flora.ai/mcp
