      tools reference advertises came from — and they are still absent from the
      published OpenAPI, which is why mcp/flora-fauna-tool-crosswalk.yml records
      them as unbound. Second, FLORA states here that /runs/* is DEPRECATED and
      hidden from the docs, while the published spec describes POST /runs/technique
      as "the normalized top-level run resource" and the nested route as
      "backward-compatible". The two statements point in opposite directions.
