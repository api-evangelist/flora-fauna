method: searched
source: >-
  https://github.com/florafauna-ai/flora-typescript/blob/main/CHANGELOG.md
  (fetched raw, HTTP 200) — the only dated, user-facing record of FLORA API change
  published on a FLORA-controlled surface. Probed and confirmed absent:
  developer.flora.ai/changelog (404), docs.flora.ai/changelog (404),
  flora.ai/changelog (404).
scheme: semver, release-please generated, per-SDK
api_changelog_published: false
api_changelog_note: >-
  FLORA publishes no API changelog page. What exists is the release history of the
  generated TypeScript SDK, which is a genuine and unusually well-written proxy —
  the maintainers explicitly "rewrite changelog with user-facing release
  descriptions" — but it describes the CLIENT, dated by SDK release, not the
  service. A consumer cannot tell from any FLORA surface when a server-side
  behaviour changed. The Go SDK and CLI have never shipped a second release, so
  they carry no change record at all.
