purpose: >-
  FLORA is the clearest case in the catalog of a code-execution MCP server: it
  ships TWO tools, and everything an agent can actually do lives one level down,
  in the @flora-ai/flora SDK methods callable inside `execute`. A tool-count
  reading of this server says "2 capabilities"; the truth is the whole REST
  surface. This crosswalk restores the mapping — SDK method -> REST operationId —
  so the agent-facing capability set is legible and each capability inherits a
  real inputSchema from the OpenAPI operation that backs it.
