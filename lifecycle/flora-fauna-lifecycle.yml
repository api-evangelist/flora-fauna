source: >-
  https://status.flora.ai (probed 200, Atlassian Statuspage), the version and
  operation descriptions in openapi/flora-fauna-flora-api-openapi.yml,
  https://docs.flora.ai/more/mcp (which announces the legacy /mcp endpoint's
