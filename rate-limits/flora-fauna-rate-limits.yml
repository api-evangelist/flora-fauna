  - {name: MCP execute total run time, limit: ~5 minutes, scope: per execute call, source: 'https://developer.flora.ai/mcp/tools'}
  - {name: webhook delivery timeout, limit: 10s, scope: per delivery attempt, source: 'https://developer.flora.ai/platform/webhooks'}
