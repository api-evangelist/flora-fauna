    "/runs/technique": {
      "post": {
        "operationId": "createTopLevelTechniqueRun",
        "summary": "Start a top-level technique run",
        "description": "Starts a technique run through the normalized top-level run resource. Mutating public API requests support an optional Idempotency-Key header for client retries; duplicate keys within two hours return idempotency_duplicate.",
        "tags": [
          "Runs"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "technique_id",
                  "workspace_id",
                  "inputs"
                ],
                "additionalProperties": false,
                "properties": {
                  "technique_id": {
                    "type": "string",
                    "description": "Technique identifier",
                    "examples": [
                      "tech_abcd1234"
                    ]
                  },
                  "workspace_id": {
                    "type": "string",
                    "description": "Workspace identifier",
                    "examples": [
                      "ws_abc123"
                    ]
                  },
                  "inputs": {
                    "type": "object",
                    "description": "Technique inputs",
                    "additionalProperties": true
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Technique run started.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "run_id": {
                      "type": "string",
                      "pattern": "^run_\\S+$",
                      "description": "Run identifier",
                      "examples": [
                        "run_abc123"
                      ]
                    },
                    "type": {
                      "enum": [
                        "generation",
                        "technique",
                        "action"
                      ],
                      "type": "string",
                      "description": "Run type"
                    },
                    "model": {
                      "anyOf": [
                        {
                          "type": "object",
                          "properties": {
                            "model_id": {
                              "type": "string",
                              "minLength": 1,
                              "description": "Model identifier",
                              "examples": [
                                "t2i-flux-2-pro"
                              ]
                            }
                          },
                          "required": [
                            "model_id"
                          ]
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "technique": {
                      "anyOf": [
                        {
                          "type": "object",
                          "properties": {
                            "technique_id": {
                              "type": "string",
                              "pattern": "^tech_\\S+$",
                              "description": "Technique identifier",
                              "examples": [
                                "tech_abcd1234"
                              ]
                            },
                            "name": {
                              "type": "string",
                              "description": "Technique name"
                            }
                          },
                          "required": [
                            "technique_id",
                            "name"
                          ]
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "action": {
                      "anyOf": [
                        {
                          "type": "object",
                          "properties": {
                            "action_id": {
                              "enum": [
                                "split-text",
                                "find-and-replace-text",
                                "concat-text",
                                "ken-burns-video",
                                "color-grade-image",
                                "change-image-ar",
                                "rotate-image",
