    "/runs/generation": {
      "post": {
        "operationId": "createGenerationRun",
        "summary": "Start a generation run",
        "description": "Starts a model generation run in a project canvas using a prompt, workspace, project, optional model, and optional model parameters. Mutating public API requests support an optional Idempotency-Key header for client retries; duplicate keys within two hours return idempotency_duplicate.",
        "deprecated": true,
        "tags": [
          "Runs"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "type",
                  "prompt",
                  "workspace_id",
                  "project_id"
                ],
                "additionalProperties": false,
                "properties": {
                  "type": {
                    "type": "string",
                    "enum": [
                      "image",
                      "video",
                      "audio",
                      "text"
                    ],
                    "description": "Generation type"
                  },
                  "prompt": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Generation prompt",
                    "examples": [
                      "A cinematic product photo of a ceramic mug on a sunlit table"
                    ]
                  },
                  "model": {
                    "type": "string",
                    "description": "Model endpoint ID",
                    "examples": [
                      "t2i-flux-2-pro"
                    ]
                  },
                  "workspace_id": {
                    "type": "string",
                    "description": "Workspace identifier",
                    "examples": [
                      "ws_abc123"
                    ]
                  },
                  "project_id": {
                    "type": "string",
                    "description": "Project identifier",
                    "examples": [
                      "prj_abc123"
                    ]
                  },
                  "params": {
                    "type": "object",
                    "description": "Model parameters",
                    "additionalProperties": true
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Generation run started.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "run_id": {
                      "type": "string",
                      "pattern": "^run_\\S+$",
                      "description": "Run identifier",
                      "examples": [
                        "run_abc123"
                      ]
                    },
                    "type": {
                      "enum": [
                        "generation",
                        "technique",
                        "action"
                      ],
                      "type": "string",
                      "description": "Run type"
                    },
                    "model": {
                      "anyOf": [
                        {
                          "type": "object",
                          "properties": {
                            "model_id": {
                              "type": "string",
                              "minLength": 1,
                              "description": "Model identifier",
                              "examples": [
                                "t2i-flux-2-pro"
                              ]
                            }
                          },
                          "required": [
                            "model_id"
                          ]
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "technique": {
                      "anyOf": [
                        {
                          "type": "object",
                          "properties": {
                            "technique_id": {
                              "type": "string",
                              "pattern": "^tech_\\S+$",
                              "description": "Technique identifier",
                              "examples": [
                                "tech_abcd1234"
                              ]
                            },
                            "name": {
                              "type": "string",
                              "description": "Technique name"
                            }
                          },
                          "required": [
                            "technique_id",
                            "name"
                          ]
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "action": {
                      "anyOf": [
                        {
                          "type": "object",
