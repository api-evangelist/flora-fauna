    "/assets/{assetId}/complete": {
      "post": {
        "operationId": "completeAssetUpload",
        "summary": "Complete a signed asset upload",
        "description": "Marks a signed asset upload as complete after the file has been uploaded. Mutating public API requests support an optional Idempotency-Key header for client retries; duplicate keys within two hours return idempotency_duplicate.",
        "tags": [
          "Assets"
        ],
        "parameters": [
          {
            "name": "assetId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^asset_\\S+$",
              "description": "Asset identifier",
              "examples": [
                "asset_abc123"
              ]
            },
            "description": "Asset identifier"
          }
        ],
        "responses": {
          "200": {
            "description": "Asset upload completed.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "asset_id": {
                      "type": "string",
                      "pattern": "^asset_\\S+$",
                      "description": "Asset identifier",
                      "examples": [
                        "asset_abc123"
                      ]
                    },
                    "url": {
                      "anyOf": [
                        {
                          "type": "string",
                          "format": "uri"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Asset URL"
                    },
                    "workspace_id": {
                      "anyOf": [
                        {
                          "type": "string",
                          "pattern": "^ws_\\S+$",
                          "description": "Workspace identifier",
                          "examples": [
                            "ws_abc123"
                          ]
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Workspace identifier"
                    },
                    "visibility": {
                      "const": "workspace"
                    },
                    "status": {
                      "enum": [
                        "pending_upload",
                        "ready",
                        "failed"
                      ],
                      "type": "string"
                    },
                    "failure_message": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Failure message when the asset is in failed status"
                    },
                    "upload": {
                      "type": "object",
                      "properties": {
                        "url": {
                          "type": "string",
                          "format": "uri",
                          "description": "Upload URL"
                        },
                        "method": {
                          "const": "POST"
                        },
                        "content_type": {
                          "const": "multipart/form-data"
                        },
                        "file_field": {
                          "const": "file"
                        },
                        "form_fields": {
                          "type": "object",
                          "additionalProperties": {
                            "type": "string"
                          },
                          "description": "Upload form fields"
                        }
                      },
                      "required": [
                        "url",
                        "method",
                        "content_type",
                        "file_field",
                        "form_fields"
                      ]
                    },
                    "upload_url": {
                      "type": "string",
                      "description": "Upload URL (serialized)",
                      "examples": [
                        "https://upload.imagekit.io/api/v1/files/upload"
                      ]
                    },
                    "expires_at": {
                      "type": "string",
                      "format": "date-time",
                      "description": "Expiration time for the upload URL"
                    }
                  },
                  "required": [
                    "asset_id",
                    "url",
                    "workspace_id",
                    "visibility",
                    "status"
                  ]
                }
              }
            }
          },
