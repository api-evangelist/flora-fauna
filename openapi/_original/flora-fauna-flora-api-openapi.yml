    "/projects/{projectId}/nodes": {
      "get": {
        "operationId": "listCanvasNodes",
        "summary": "List project canvas nodes",
        "description": "Returns sanitized visible media nodes on a project canvas. The response omits raw graph documents, Liveblocks internals, raw Convex IDs, and unbounded node data blobs.",
        "tags": [
          "Canvas"
        ],
        "parameters": [
          {
            "name": "projectId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^prj_\\S+$",
              "description": "Project identifier",
              "examples": [
                "prj_abc123"
              ]
            },
            "description": "Project identifier"
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "description": "Maximum number of results to return"
            },
            "allowEmptyValue": true,
            "allowReserved": true,
            "description": "Maximum number of results to return"
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string",
              "description": "Opaque cursor for fetching the next page",
              "examples": [
                "eyJvZmZzZXQiOjIwfQ"
              ]
            },
            "allowEmptyValue": true,
            "allowReserved": true,
            "description": "Opaque cursor for fetching the next page"
          }
        ],
        "responses": {
          "200": {
            "description": "Canvas nodes returned.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "project_id": {
                      "type": "string",
                      "pattern": "^prj_\\S+$",
                      "description": "Project identifier",
                      "examples": [
                        "prj_abc123"
                      ]
                    },
                    "canvas_url": {
                      "type": "string",
                      "format": "uri",
                      "description": "Project canvas URL"
                    },
                    "nodes": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "node_id": {
                            "type": "string",
                            "minLength": 1,
                            "description": "Canvas node identifier",
                            "examples": [
                              "node_abc123"
                            ]
                          },
                          "type": {
                            "enum": [
                              "image",
                              "video",
                              "audio",
                              "text"
                            ],
                            "type": "string",
                            "description": "Canvas node media type"
                          },
                          "label": {
                            "anyOf": [
                              {
                                "type": "string",
                                "description": "Canvas node label",
                                "examples": [
                                  "Logo"
                                ]
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Canvas node label"
                          },
                          "asset_id": {
                            "anyOf": [
                              {
                                "type": "string",
                                "pattern": "^asset_\\S+$",
                                "description": "Asset identifier",
                                "examples": [
                                  "asset_abc123"
                                ]
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Asset identifier"
                          },
                          "url": {
                            "anyOf": [
                              {
                                "type": "string",
                                "minLength": 1,
                                "description": "Canvas node output URL or text content",
                                "examples": [
                                  "https://media.flora.ai/output.png"
                                ]
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Canvas node output URL or text content"
                          },
                          "width": {
                            "anyOf": [
                              {
                                "type": "integer"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          },
                          "height": {
                            "anyOf": [
                              {
                                "type": "integer"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          }
                        },
                        "required": [
                          "node_id",
                          "type"
                        ]
                      }
                    },
                    "meta": {
                      "type": "object",
                      "properties": {
                        "next_cursor": {
                          "anyOf": [
                            {
                              "type": "string",
                              "description": "Opaque cursor for fetching the next page",
                              "examples": [
                                "eyJvZmZzZXQiOjIwfQ"
                              ]
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Opaque cursor for fetching the next page"
                        },
                        "total_estimate": {
                          "anyOf": [
                            {
                              "type": "integer",
                              "minimum": 0,
                              "description": "Estimated total matching items"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Estimated total matching items"
                        }
                      },
                      "required": [
                        "next_cursor"
                      ]
                    }
                  },
                  "required": [
                    "project_id",
                    "canvas_url",
                    "nodes",
                    "meta"
                  ]
                }
              }
            }
          },
