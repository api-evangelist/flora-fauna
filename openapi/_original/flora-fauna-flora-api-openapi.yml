    "/projects/{projectId}/canvas": {
      "get": {
        "operationId": "getProjectCanvas",
        "summary": "Get project canvas",
        "description": "Returns the current project canvas topology as a Mermaid flowchart using the same serializer as the Fauna agent.",
        "tags": [
          "Projects"
        ],
        "parameters": [
          {
            "name": "projectId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^prj_\\S+$",
              "description": "Project identifier",
              "examples": [
                "prj_abc123"
              ]
            },
            "description": "Project identifier"
          }
        ],
        "responses": {
          "200": {
            "description": "Project canvas returned.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "project_id": {
                      "type": "string",
                      "pattern": "^prj_\\S+$",
                      "description": "Project identifier",
                      "examples": [
                        "prj_abc123"
                      ]
                    },
                    "canvas_url": {
                      "type": "string",
                      "format": "uri",
                      "description": "Project canvas URL"
                    },
                    "diagram": {
                      "type": "string",
                      "minLength": 1,
                      "description": "Mermaid flowchart diagram",
                      "examples": [
                        "graph LR\n  n1[\"Prompt (text)\"]\n  n2[\"Result (image)\"]\n  n1 -->|text| n2"
                      ]
                    },
                    "summary": {
                      "type": "object",
                      "properties": {
                        "node_count": {
                          "type": "integer",
                          "minimum": 0
                        },
                        "edge_count": {
                          "type": "integer",
                          "minimum": 0
                        },
                        "workflow_count": {
                          "type": "integer",
                          "minimum": 0
                        },
                        "isolated_node_count": {
                          "type": "integer",
                          "minimum": 0
                        },
                        "group_count": {
                          "type": "integer",
                          "minimum": 0
