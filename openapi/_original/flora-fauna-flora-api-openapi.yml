    "/generate": {
      "post": {
        "operationId": "startGeneration",
        "summary": "Start a generation",
        "description": "Starts a model generation using a prompt, workspace, project, optional model, and optional model parameters. Poll the returned run_id via GET /runs/{runId} for progress and outputs. Mutating public API requests support an optional Idempotency-Key header for client retries; duplicate keys within two hours return idempotency_duplicate.",
        "tags": [
          "Generations"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "type",
                  "prompt",
                  "workspace_id",
                  "project_id"
                ],
                "additionalProperties": false,
                "properties": {
                  "type": {
                    "type": "string",
                    "enum": [
                      "image",
                      "video",
                      "audio",
                      "text"
                    ],
                    "description": "Generation type"
                  },
                  "prompt": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Generation prompt",
                    "examples": [
                      "A cinematic product photo of a ceramic mug on a sunlit table"
                    ]
                  },
                  "model": {
                    "type": "string",
                    "description": "Model endpoint ID",
                    "examples": [
                      "t2i-flux-2-pro"
                    ]
                  },
                  "workspace_id": {
                    "type": "string",
                    "description": "Workspace identifier",
                    "examples": [
                      "ws_abc123"
                    ]
                  },
                  "project_id": {
                    "type": "string",
                    "description": "Project identifier",
                    "examples": [
                      "prj_abc123"
                    ]
                  },
                  "params": {
                    "type": "object",
                    "description": "Model parameters",
                    "additionalProperties": true
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Generation started.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "run_id": {
                      "type": "string",
