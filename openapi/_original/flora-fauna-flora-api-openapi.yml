                    "type": {
                      "enum": [
                        "generation",
                        "technique",
                        "action"
                      ],
                      "type": "string",
                      "description": "Run type"
                    },
                    "model": {
                      "anyOf": [
                        {
                          "type": "object",
                          "properties": {
                            "model_id": {
                              "type": "string",
                              "minLength": 1,
                              "description": "Model identifier",
                              "examples": [
                                "t2i-flux-2-pro"
                              ]
                            }
                          },
                          "required": [
                            "model_id"
                          ]
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "technique": {
                      "anyOf": [
                        {
                          "type": "object",
                          "properties": {
                            "technique_id": {
                              "type": "string",
                              "pattern": "^tech_\\S+$",
                              "description": "Technique identifier",
                              "examples": [
                                "tech_abcd1234"
                              ]
                            },
                            "name": {
                              "type": "string",
                              "description": "Technique name"
                            }
