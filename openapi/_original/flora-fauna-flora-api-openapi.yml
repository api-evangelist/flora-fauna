      "post": {
        "operationId": "uploadAsset",
        "summary": "Create an asset upload",
        "description": "Creates an asset from an allowlisted source URL or reserves a signed upload URL. Mutating public API requests support an optional Idempotency-Key header for client retries; duplicate keys within two hours return idempotency_duplicate.",
        "tags": [
          "Assets"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "source",
                  "workspace_id"
                ],
                "additionalProperties": false,
                "properties": {
                  "source": {
                    "type": "string",
                    "description": "Asset source URL or signed-url upload mode",
                    "examples": [
                      "signed-url",
                      "https://example.com/source.png"
                    ]
                  },
                  "workspace_id": {
                    "type": "string",
                    "description": "Workspace identifier",
                    "examples": [
                      "ws_abc123"
                    ]
                  },
                  "folder": {
                    "type": "string",
                    "description": "Destination folder",
                    "examples": [
                      "campaign-assets"
                    ]
                  },
                  "content_type": {
                    "type": "string",
                    "description": "Asset content type",
                    "examples": [
                      "image/png"
                    ]
                  },
                  "file_name": {
                    "type": "string",
                    "description": "Asset file name",
                    "examples": [
                      "hero.png"
                    ]
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Asset upload created.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "asset_id": {
                      "type": "string",
                      "pattern": "^asset_\\S+$",
                      "description": "Asset identifier",
                      "examples": [
                        "asset_abc123"
                      ]
                    },
                    "uploaded_via": {
                      "enum": [
                        "url",
                        "signed_url"
                      ],
                      "type": "string",
                      "description": "Asset source"
                    },
                    "url": {
                      "type": "string",
                      "format": "uri",
                      "description": "Asset URL"
                    },
                    "workspace_id": {
                      "type": "string",
                      "pattern": "^ws_\\S+$",
                      "description": "Workspace identifier",
                      "examples": [
                        "ws_abc123"
                      ]
                    },
                    "visibility": {
                      "const": "workspace"
                    },
                    "status": {
                      "enum": [
                        "pending_upload",
                        "ready",
                        "failed"
                      ],
                      "type": "string"
                    },
                    "upload": {
                      "type": "object",
                      "properties": {
                        "url": {
                          "type": "string",
                          "format": "uri",
                          "description": "Upload URL"
                        },
                        "method": {
                          "const": "POST"
                        },
                        "content_type": {
                          "const": "multipart/form-data"
                        },
                        "file_field": {
                          "const": "file"
                        },
                        "form_fields": {
                          "type": "object",
                          "additionalProperties": {
                            "type": "string"
                          },
                          "description": "Upload form fields"
                        }
                      },
                      "required": [
                        "url",
                        "method",
                        "content_type",
                        "file_field",
                        "form_fields"
                      ]
                    },
                    "upload_url": {
                      "type": "string",
                      "description": "Upload URL (serialized)",
                      "examples": [
                        "https://upload.imagekit.io/api/v1/files/upload"
                      ]
                    },
                    "expires_at": {
                      "type": "string",
                      "format": "date-time",
                      "description": "Expiration time for the upload URL"
                    }
                  },
                  "required": [
                    "asset_id",
                    "uploaded_via",
                    "url",
                    "workspace_id",
                    "visibility",
                    "status"
                  ]
                }
              }
            }
          },
