    "/techniques/{techniqueId}": {
      "get": {
        "operationId": "getTechnique",
        "summary": "Get a technique",
        "description": "Returns the public definition for one technique, including its input and output schema used to start runs.",
        "tags": [
          "Techniques"
        ],
        "parameters": [
          {
            "name": "techniqueId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "description": "Technique identifier or slug",
              "examples": [
                "art-directors-critique",
                "auto-translate",
                "book-drop",
                "cctv-cam",
                "character-lock",
                "cinematic-movie-generator",
                "color-mapping",
                "color-transfer"
