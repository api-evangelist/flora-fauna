    "/runs/action": {
      "post": {
        "operationId": "createActionRun",
        "summary": "Start an action run",
        "description": "Starts a headless prebuilt action run using raw action slugs such as rotate-image. Direct action runs do not create or mutate canvas nodes. Mutating public API requests support an optional Idempotency-Key header for client retries; duplicate keys within two hours return idempotency_duplicate.",
        "tags": [
          "Runs"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "action_id",
                  "workspace_id",
                  "project_id",
                  "inputs"
                ],
                "additionalProperties": false,
                "properties": {
                  "action_id": {
                    "description": "Action identifier. Use raw action slugs, not action-prefixed IDs.",
                    "enum": [
                      "split-text",
                      "find-and-replace-text",
                      "concat-text",
                      "ken-burns-video",
                      "color-grade-image",
                      "change-image-ar",
                      "rotate-image",
                      "flip-image",
                      "color-filter-image",
                      "color-tint-image",
                      "filter-color-image",
                      "blur-image",
                      "duplicate-image",
                      "side-by-side-composite",
                      "add-shape-to-image",
                      "generate-shape-image",
                      "add-text-to-image",
                      "generate-text-image",
                      "qr-code-generator",
                      "stitch-videos",
                      "split-video",
                      "extract-video-frames",
                      "color-grade-video",
                      "video-to-frame-grid",
                      "boomerang-video",
                      "reverse-video",
                      "video-to-long-exposure",
                      "video-effect",
                      "color-filter-video",
                      "speed-up-video",
                      "slow-down-video",
                      "duplicate-video",
                      "greenscreen-video",
                      "resize-video",
                      "change-video-ar",
                      "split-audio-from-video",
                      "merge-audio-into-video"
                    ],
                    "examples": [
                      "split-text",
                      "find-and-replace-text",
                      "concat-text",
                      "ken-burns-video",
                      "color-grade-image",
                      "change-image-ar",
                      "rotate-image",
                      "flip-image",
                      "color-filter-image",
                      "color-tint-image",
                      "filter-color-image",
                      "blur-image",
                      "duplicate-image",
                      "side-by-side-composite",
                      "add-shape-to-image",
                      "generate-shape-image",
                      "add-text-to-image",
                      "generate-text-image",
                      "qr-code-generator",
                      "stitch-videos",
                      "split-video",
                      "extract-video-frames",
                      "color-grade-video",
                      "video-to-frame-grid",
                      "boomerang-video",
                      "reverse-video",
                      "video-to-long-exposure",
                      "video-effect",
                      "color-filter-video",
                      "speed-up-video",
                      "slow-down-video",
                      "duplicate-video",
                      "greenscreen-video",
                      "resize-video",
                      "change-video-ar",
                      "split-audio-from-video",
                      "merge-audio-into-video"
                    ],
                    "type": "string"
                  },
                  "workspace_id": {
                    "type": "string",
                    "description": "Workspace identifier",
                    "examples": [
                      "ws_abc123"
                    ]
                  },
                  "project_id": {
                    "type": "string",
                    "description": "Project identifier used for ownership, billing, and run history. Direct action runs do not mutate the project canvas.",
                    "examples": [
                      "prj_abc123"
                    ]
                  },
                  "inputs": {
                    "type": "array",
                    "description": "Action inputs. Direct action runs are headless and read inputs from URLs/text rather than canvas edges.",
                    "minItems": 1,
                    "items": {
                      "type": "object",
                      "required": [
                        "type"
                      ],
                      "additionalProperties": false,
                      "properties": {
                        "type": {
                          "type": "string",
                          "enum": [
                            "image",
                            "video",
                            "audio",
                            "text"
                          ]
                        },
                        "url": {
                          "type": "string",
                          "format": "uri",
                          "description": "Input media URL"
                        },
                        "text": {
                          "type": "string",
                          "description": "Input text value"
                        },
                        "name": {
                          "type": "string",
                          "description": "Optional input name"
                        }
                      }
                    }
                  },
                  "params": {
                    "type": "object",
                    "description": "Action parameters",
                    "additionalProperties": true
                  }
