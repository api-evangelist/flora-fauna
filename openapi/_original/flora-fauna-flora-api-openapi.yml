      "patch": {
        "operationId": "patchProjectCanvas",
        "summary": "Patch project canvas",
        "description": "Applies a Mermaid flowchart patch to the project canvas using the same create_workflow path as the Fauna agent. The diagram may add nodes, connect nodes, and reference existing canvas nodes by their Mermaid short IDs.",
        "tags": [
          "Projects"
        ],
        "parameters": [
          {
            "name": "projectId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^prj_\\S+$",
              "description": "Project identifier",
              "examples": [
                "prj_abc123"
              ]
            },
            "description": "Project identifier"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "diagram": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Mermaid flowchart diagram to apply",
                    "examples": [
                      "graph LR\n  source[\"Product photo (Image)\"]\n  output[\"Editorial campaign image (Image)\"]\n  source --> output"
                    ]
                  },
                  "node_params": {
                    "type": "object",
                    "additionalProperties": {
                      "type": "object",
                      "properties": {
                        "prompt": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "model": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "content_url": {
                          "anyOf": [
                            {
                              "type": "string",
                              "format": "uri"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "aspect_ratio": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "resolution": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "model_parameters": {
                          "anyOf": [
                            {
                              "type": "object",
                              "additionalProperties": {}
                            },
                            {
                              "type": "null"
                            }
                          ]
                        }
                      }
                    },
                    "description": "Optional per-node parameters keyed by Mermaid node ID."
                  }
                },
                "required": [
                  "diagram"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Project canvas patched.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "project_id": {
                      "type": "string",
                      "pattern": "^prj_\\S+$",
                      "description": "Project identifier",
                      "examples": [
                        "prj_abc123"
                      ]
                    },
                    "canvas_url": {
                      "type": "string",
                      "format": "uri",
                      "description": "Project canvas URL"
                    },
                    "diagram": {
                      "type": "string",
                      "minLength": 1,
                      "description": "Applied Mermaid flowchart diagram",
                      "examples": [
                        "graph LR\n  n1[\"Prompt (text)\"]\n  n2[\"Result (image)\"]\n  n1 --> n2"
                      ]
                    },
                    "created_node_count": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "created_edge_count": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "warnings": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    }
                  },
                  "required": [
                    "project_id",
                    "canvas_url",
                    "diagram",
                    "created_node_count",
                    "created_edge_count"
                  ]
                }
              }
            }
          },
