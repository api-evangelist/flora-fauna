    "/assets/{assetId}": {
      "get": {
        "operationId": "getAsset",
        "summary": "Get an asset",
        "description": "Returns metadata for one asset when it is accessible to the authenticated public API key. Missing and inaccessible assets both return 404.",
        "tags": [
          "Assets"
        ],
        "parameters": [
          {
            "name": "assetId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^asset_\\S+$",
              "description": "Asset identifier",
              "examples": [
                "asset_abc123"
              ]
            },
            "description": "Asset identifier"
          }
        ],
        "responses": {
          "200": {
            "description": "Asset returned.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "asset_id": {
                      "type": "string",
                      "pattern": "^asset_\\S+$",
                      "description": "Asset identifier",
                      "examples": [
                        "asset_abc123"
                      ]
                    },
                    "name": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Asset name"
                    },
                    "description": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Asset description"
                    },
                    "workspace_id": {
                      "anyOf": [
                        {
                          "type": "string",
                          "pattern": "^ws_\\S+$",
                          "description": "Workspace identifier",
                          "examples": [
                            "ws_abc123"
                          ]
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Workspace identifier"
                    },
                    "url": {
                      "anyOf": [
                        {
                          "type": "string",
                          "format": "uri"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Asset URL"
                    },
                    "content_type": {
                      "type": "string",
                      "description": "Asset content type"
                    },
                    "upload_content_type": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Content type provided at upload time"
                    },
                    "size_bytes": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "uploaded_via": {
                      "type": "string",
                      "description": "Asset source"
                    },
                    "created_at": {
                      "anyOf": [
                        {
                          "type": "string",
                          "format": "date-time"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Asset creation time (ISO 8601 datetime)"
                    },
                    "status": {
                      "enum": [
                        "pending_upload",
                        "ready",
                        "failed"
                      ],
                      "type": "string"
                    },
                    "failure_message": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Failure message when the asset is in failed status"
                    },
                    "width": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "height": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": [
                    "asset_id",
