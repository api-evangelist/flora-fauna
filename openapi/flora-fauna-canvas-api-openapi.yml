  /projects/{projectId}/nodes:
    get:
      operationId: listCanvasNodes
      summary: List project canvas nodes
      description: Returns sanitized visible media nodes on a project canvas. The response omits raw graph documents, Liveblocks internals, raw Convex IDs, and unbounded node data blobs.
      tags:
      - Canvas
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^prj_\S+$
          description: Project identifier
          examples:
          - prj_abc123
        description: Project identifier
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of results to return
        allowEmptyValue: true
        allowReserved: true
        description: Maximum number of results to return
      - name: cursor
        in: query
        schema:
          type: string
          description: Opaque cursor for fetching the next page
          examples:
          - eyJvZmZzZXQiOjIwfQ
        allowEmptyValue: true
        allowReserved: true
        description: Opaque cursor for fetching the next page
      responses:
        '200':
          description: Canvas nodes returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    pattern: ^prj_\S+$
                    description: Project identifier
                    examples:
                    - prj_abc123
                  canvas_url:
                    type: string
                    format: uri
                    description: Project canvas URL
                  nodes:
                    type: array
