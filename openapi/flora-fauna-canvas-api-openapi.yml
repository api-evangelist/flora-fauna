                      type: object
                      properties:
                        node_id:
                          type: string
                          minLength: 1
                          description: Canvas node identifier
                          examples:
                          - node_abc123
                        type:
                          enum:
                          - image
                          - video
                          - audio
                          - text
                          type: string
                          description: Canvas node media type
                        label:
                          anyOf:
                          - type: string
                            description: Canvas node label
                            examples:
                            - Logo
                          - type: 'null'
                          description: Canvas node label
                        asset_id:
                          anyOf:
                          - type: string
                            pattern: ^asset_\S+$
                            description: Asset identifier
                            examples:
                            - asset_abc123
                          - type: 'null'
                          description: Asset identifier
                        url:
                          anyOf:
                          - type: string
                            minLength: 1
                            description: Canvas node output URL or text content
                            examples:
                            - https://media.flora.ai/output.png
                          - type: 'null'
                          description: Canvas node output URL or text content
                        width:
                          anyOf:
                          - type: integer
                          - type: 'null'
                        height:
                          anyOf:
                          - type: integer
                          - type: 'null'
                      required:
                      - node_id
                      - type
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        anyOf:
                        - type: string
                          description: Opaque cursor for fetching the next page
                          examples:
                          - eyJvZmZzZXQiOjIwfQ
                        - type: 'null'
                        description: Opaque cursor for fetching the next page
                      total_estimate:
                        anyOf:
                        - type: integer
                          minimum: 0
                          description: Estimated total matching items
                        - type: 'null'
                        description: Estimated total matching items
                    required:
                    - next_cursor
                required:
                - project_id
                - canvas_url
                - nodes
                - meta
