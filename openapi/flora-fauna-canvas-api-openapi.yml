  /projects/{projectId}/actions/{nodeId}/run:
    post:
      operationId: runCanvasAction
      summary: Run a canvas action
      description: Runs an existing canvas action node through the action execution workflow.
      tags:
      - Canvas
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^prj_\S+$
          description: Project identifier
          examples:
          - prj_abc123
        description: Project identifier
      - name: nodeId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: ^\S+$
          description: Canvas action node identifier
        description: Canvas action node identifier
      responses:
        '201':
          description: Canvas action run started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                    pattern: ^run_\S+$
                    description: Run identifier
                    examples:
                    - run_abc123
                  type:
                    enum:
                    - generation
                    - technique
                    - action
                    type: string
                    description: Run type
                  model:
                    anyOf:
                    - type: object
                      properties:
                        model_id:
                          type: string
                          minLength: 1
                          description: Model identifier
                          examples:
                          - t2i-flux-2-pro
                      required:
                      - model_id
                    - type: 'null'
                  technique:
                    anyOf:
                    - type: object
                      properties:
                        technique_id:
                          type: string
                          pattern: ^tech_\S+$
                          description: Technique identifier
                          examples:
                          - tech_abcd1234
                        name:
                          type: string
                          description: Technique name
                      required:
                      - technique_id
                      - name
                    - type: 'null'
                  action:
                    anyOf:
                    - type: object
                      properties:
                        action_id:
                          enum:
                          - split-text
                          - find-and-replace-text
                          - concat-text
                          - ken-burns-video
                          - color-grade-image
                          - change-image-ar
