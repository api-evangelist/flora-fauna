openapi: 3.2.0
info:
  title: Flora.ai Projects API
  version: 1.6.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Project management endpoints.
servers:
- url: https://app.flora.ai/api/v1
security:
- bearerAuth: []
tags:
- name: Projects
  description: Project management endpoints.
paths:
  /projects:
    get:
      operationId: listProjects
      summary: List workspace projects
      description: Returns projects in the requested workspace that are accessible to the authenticated public API key, ordered by recent activity.
      tags:
      - Projects
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of results to return
        allowEmptyValue: true
        allowReserved: true
        description: Maximum number of results to return
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          description: Opaque cursor for fetching the next page
          examples:
          - eyJvZmZzZXQiOjIwfQ
        allowEmptyValue: true
        allowReserved: true
        description: Opaque cursor for fetching the next page
      - name: query
        in: query
        required: false
        schema:
          type: string
          description: Search query
          examples:
          - logo
        allowEmptyValue: true
        allowReserved: true
        description: Search query
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^ws_\S+$
          description: Workspace identifier
          examples:
          - ws_abc123
        allowEmptyValue: true
        allowReserved: true
        description: Workspace identifier
      responses:
        '200':
          description: Projects returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        project_id:
                          type: string
                          pattern: ^prj_\S+$
                          description: Project identifier
                          examples:
                          - prj_abc123
                        name:
                          type: string
                          description: Project name
                          examples:
                          - Spring Campaign
                        workspace_id:
                          type: string
                          pattern: ^ws_\S+$
                          description: Workspace identifier
                          examples:
                          - ws_abc123
                        origin:
                          anyOf:
                          - type: string
                            description: Project origin
                            examples:
                            - api
                          - type: 'null'
                          description: Project origin
                        last_modified:
                          anyOf:
                          - type: number
                          - type: 'null'
                        created_at:
                          type: number
                      required:
                      - project_id
                      - name
                      - workspace_id
                      - origin
                      - last_modified
                      - created_at
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        anyOf:
                        - type: string
                          description: Opaque cursor for fetching the next page
                          examples:
                          - eyJvZmZzZXQiOjIwfQ
                        - type: 'null'
                        description: Opaque cursor for fetching the next page
                      total_estimate:
                        anyOf:
                        - type: integer
                          minimum: 0
                          description: Estimated total matching items
                        - type: 'null'
                        description: Estimated total matching items
                    required:
                    - next_cursor
                required:
                - projects
                - meta
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                        - unauthorized
                        - invalid_api_key
                        - forbidden
                        - invalid_json
                        - input_validation_error
                        - not_found
                        - insufficient_credits
                        - idempotency_duplicate
                        - rate_limited
                        - unknown_error
                        examples:
                        - input_validation_error
                      message:
                        type: string
                        examples:
                        - 'name: Required'
                      fields:
                        type: array
                        items:
                          type: object
                          required:
                          - field
                          - message
                          additionalProperties: false
