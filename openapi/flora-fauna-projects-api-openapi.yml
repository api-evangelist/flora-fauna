    post:
      operationId: createProject
      summary: Create a project
      description: Creates a new Flora project in the requested workspace. Mutating public API requests support an optional Idempotency-Key header for client retries; duplicate keys within two hours return idempotency_duplicate.
      tags:
      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workspace_id
              - name
              additionalProperties: false
              properties:
                workspace_id:
                  type: string
                  description: Workspace identifier
                  examples:
                  - ws_abc123
                name:
                  type: string
                  minLength: 1
                  description: Project name
                  examples:
                  - Spring Campaign
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    pattern: ^prj_\S+$
                    description: Project identifier
                    examples:
                    - prj_abc123
                  name:
                    type: string
                    description: Project name
                    examples:
                    - Spring Campaign
                  workspace_id:
                    type: string
                    pattern: ^ws_\S+$
                    description: Workspace identifier
                    examples:
                    - ws_abc123
                  origin:
                    anyOf:
                    - type: string
                      description: Project origin
                      examples:
                      - api
                    - type: 'null'
                    description: Project origin
                  last_modified:
                    anyOf:
                    - type: number
                    - type: 'null'
                  created_at:
                    type: number
                required:
                - project_id
                - name
