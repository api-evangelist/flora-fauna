  /projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a project
      description: Returns metadata for a single project when it is accessible to the authenticated public API key. Missing and inaccessible projects both return 404.
      tags:
      - Projects
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^prj_\S+$
          description: Project identifier
          examples:
          - prj_abc123
        description: Project identifier
      responses:
        '200':
          description: Project returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    pattern: ^prj_\S+$
                    description: Project identifier
                    examples:
                    - prj_abc123
                  name:
                    type: string
                    description: Project name
                    examples:
                    - Spring Campaign
                  workspace_id:
                    type: string
                    pattern: ^ws_\S+$
                    description: Workspace identifier
                    examples:
                    - ws_abc123
                  origin:
                    anyOf:
                    - type: string
                      description: Project origin
                      examples:
                      - api
                    - type: 'null'
                    description: Project origin
                  last_modified:
                    anyOf:
                    - type: number
                    - type: 'null'
                  created_at:
                    type: number
                required:
                - project_id
                - name
                - workspace_id
                - origin
                - last_modified
                - created_at
        '400':
          description: '400'
          content:
