    patch:
      operationId: patchProjectCanvas
      summary: Patch project canvas
      description: Applies a Mermaid flowchart patch to the project canvas using the same create_workflow path as the Fauna agent. The diagram may add nodes, connect nodes, and reference existing canvas nodes by their Mermaid short IDs.
      tags:
      - Projects
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^prj_\S+$
          description: Project identifier
          examples:
          - prj_abc123
        description: Project identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                diagram:
                  type: string
                  minLength: 1
                  description: Mermaid flowchart diagram to apply
                  examples:
                  - "graph LR\n  source[\"Product photo (Image)\"]\n  output[\"Editorial campaign image (Image)\"]\n  source --> output"
