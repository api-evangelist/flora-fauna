                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      prompt:
                        anyOf:
                        - type: string
                        - type: 'null'
                      model:
                        anyOf:
                        - type: string
                        - type: 'null'
                      content_url:
                        anyOf:
                        - type: string
                          format: uri
                        - type: 'null'
                      aspect_ratio:
                        anyOf:
                        - type: string
                        - type: 'null'
                      resolution:
                        anyOf:
                        - type: string
                        - type: 'null'
                      model_parameters:
