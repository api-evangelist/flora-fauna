openapi: 3.2.0
info:
  title: Flora.ai Feedback API
  version: 1.6.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Product feedback endpoints.
servers:
- url: https://app.flora.ai/api/v1
security:
- bearerAuth: []
tags:
- name: Feedback
  description: Product feedback endpoints.
paths:
  /feedback:
    post:
      operationId: recordFeedback
      summary: Record product feedback
      description: Records product feedback from the authenticated user, optionally linked to a workspace, project, run, and attempted tools. Mutating public API requests support an optional Idempotency-Key header for client retries; duplicate keys within two hours return idempotency_duplicate.
      tags:
      - Feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  enum:
                  - feature_request
                  - bug
                  - technique_request
                  - missing_capability
                  type: string
                  description: Feedback kind
                summary:
                  type: string
                  minLength: 1
                  description: Short summary
                  examples:
                  - Need batch export support
                detail:
                  type: string
                  minLength: 1
                  description: Detailed description
                  examples:
                  - I want to export all generated campaign images at once.
                attempted_tools:
                  type: array
                  items:
                    type: string
                    description: Attempted tool name
                    examples:
                    - generate_image
                  description: Tools or capabilities attempted before submitting feedback
                workspace_id:
                  type: string
                  pattern: ^ws_\S+$
                  description: Workspace identifier
                  examples:
                  - ws_abc123
                project_id:
                  type: string
                  pattern: ^prj_\S+$
                  description: Project identifier
                  examples:
                  - prj_abc123
                run_id:
                  type: string
                  pattern: ^run_\S+$
                  description: Run identifier
                  examples:
                  - run_abc123
              required:
              - kind
              - summary
              - detail
      responses:
        '201':
          description: Feedback recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback_id:
                    type: string
                    pattern: ^fb_\S+$
                    description: Feedback identifier
                    examples:
                    - fb_abc123
                  received_at:
                    type: integer
                required:
                - feedback_id
                - received_at
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                        - unauthorized
                        - invalid_api_key
                        - forbidden
                        - invalid_json
                        - input_validation_error
                        - not_found
                        - insufficient_credits
                        - idempotency_duplicate
                        - rate_limited
                        - unknown_error
                        examples:
                        - input_validation_error
                      message:
                        type: string
                        examples:
                        - 'name: Required'
                      fields:
                        type: array
                        items:
                          type: object
                          required:
                          - field
                          - message
                          additionalProperties: false
                          properties:
                            field:
                              type: string
                              examples:
                              - name
                            message:
                              type: string
                              examples:
                              - Required
              examples:
                input_validation_error:
                  summary: Invalid request
                  value:
                    error:
                      code: input_validation_error
                      message: 'prompt: Required'
                      fields:
                      - field: prompt
                        message: Required
        '401':
