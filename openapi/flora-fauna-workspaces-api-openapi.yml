openapi: 3.2.0
info:
  title: Flora.ai Workspaces API
  version: 1.6.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Workspace discovery endpoints.
servers:
- url: https://app.flora.ai/api/v1
security:
- bearerAuth: []
tags:
- name: Workspaces
  description: Workspace discovery endpoints.
paths:
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List accessible workspaces
      description: Returns the workspaces available to the authenticated public API key, including each workspace's public ID, name, creation timestamp, and caller role.
      tags:
      - Workspaces
      parameters: []
      responses:
        '200':
          description: Accessible workspaces returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items:
                      type: object
                      properties:
                        workspace_id:
                          type: string
                          pattern: ^ws_\S+$
                          description: Workspace identifier
                          examples:
                          - ws_abc123
                        name:
                          type: string
                          description: Workspace name
                          examples:
                          - Brand Studio
                        created_at:
                          anyOf:
                          - type: integer
                          - type: 'null'
                        role:
                          type: string
                          description: Workspace role
                      required:
                      - workspace_id
                      - name
                      - created_at
                      - role
                required:
                - workspaces
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                        - unauthorized
                        - invalid_api_key
                        - forbidden
                        - invalid_json
                        - input_validation_error
                        - not_found
                        - insufficient_credits
                        - idempotency_duplicate
                        - rate_limited
                        - unknown_error
                        examples:
                        - input_validation_error
                      message:
                        type: string
                        examples:
                        - 'name: Required'
                      fields:
                        type: array
                        items:
                          type: object
                          required:
                          - field
                          - message
                          additionalProperties: false
                          properties:
                            field:
                              type: string
                              examples:
                              - name
                            message:
                              type: string
                              examples:
                              - Required
              examples:
                input_validation_error:
                  summary: Invalid request
                  value:
                    error:
                      code: input_validation_error
                      message: 'prompt: Required'
                      fields:
                      - field: prompt
                        message: Required
        '401':
          description: '401'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
