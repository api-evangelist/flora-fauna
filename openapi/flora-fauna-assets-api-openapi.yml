openapi: 3.2.0
info:
  title: Flora.ai Assets API
  version: 1.6.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Asset upload and retrieval endpoints.
servers:
- url: https://app.flora.ai/api/v1
security:
- bearerAuth: []
tags:
- name: Assets
  description: Asset upload and retrieval endpoints.
paths:
  /assets:
    get:
      operationId: listAssets
      summary: List assets
      description: Returns assets visible to the authenticated public API key. Filter by workspace, project canvas, search query, cursor, and limit without exposing raw file bytes or internal graph data.
      tags:
      - Assets
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of results to return
        allowEmptyValue: true
        allowReserved: true
        description: Maximum number of results to return
      - name: cursor
        in: query
        schema:
          type: string
          description: Opaque cursor for fetching the next page
          examples:
          - eyJvZmZzZXQiOjIwfQ
        allowEmptyValue: true
        allowReserved: true
        description: Opaque cursor for fetching the next page
      - name: query
        in: query
        schema:
          type: string
          description: Search query
          examples:
          - logo
        allowEmptyValue: true
        allowReserved: true
        description: Search query
      - name: workspace_id
        in: query
        schema:
          type: string
          pattern: ^ws_\S+$
          description: Workspace identifier
          examples:
          - ws_abc123
        allowEmptyValue: true
        allowReserved: true
        description: Workspace identifier
      - name: project_id
        in: query
        schema:
          type: string
          pattern: ^prj_\S+$
          description: Project identifier
          examples:
          - prj_abc123
        allowEmptyValue: true
        allowReserved: true
        description: Project identifier
      responses:
        '200':
          description: Assets returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        asset_id:
                          anyOf:
                          - type: string
                            pattern: ^asset_\S+$
                            description: Asset identifier
                            examples:
                            - asset_abc123
                          - type: 'null'
                          description: Asset identifier
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: Asset name
                        description:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: Asset description
                        workspace_id:
                          anyOf:
                          - type: string
                            pattern: ^ws_\S+$
                            description: Workspace identifier
                            examples:
                            - ws_abc123
                          - type: 'null'
                          description: Workspace identifier
                        url:
                          anyOf:
                          - type: string
                            format: uri
                          - type: 'null'
                          description: Asset URL
                        content_type:
                          type: string
                          description: Asset content type
                        upload_content_type:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: Content type provided at upload time
                        uploaded_via:
                          type: string
                          description: Asset source
                        status:
                          enum:
                          - pending_upload
                          - ready
                          - failed
                          type: string
                        width:
                          anyOf:
                          - type: integer
                          - type: 'null'
                        height:
                          anyOf:
                          - type: integer
                          - type: 'null'
                        size_bytes:
                          anyOf:
                          - type: integer
                          - type: 'null'
                        created_at:
                          anyOf:
                          - type: integer
                          - type: 'null'
                        node_id:
                          anyOf:
                          - type: string
                            description: Associated node identifier
                            examples:
                            - node_abc123
                          - type: 'null'
                          description: Associated node identifier
                        project_id:
                          anyOf:
                          - type: string
                            pattern: ^prj_\S+$
                            description: Project identifier
                            examples:
                            - prj_abc123
                          - type: 'null'
                          description: Project identifier
                      required:
                      - asset_id
                      - name
                      - description
                      - workspace_id
                      - url
                      - content_type
                      - upload_content_type
                      - uploaded_via
                      - status
                      - width
                      - height
                      - size_bytes
                      - created_at
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        anyOf:
                        - type: string
                          description: Opaque cursor for fetching the next page
                          examples:
                          - eyJvZmZzZXQiOjIwfQ
                        - type: 'null'
                        description: Opaque cursor for fetching the next page
                      total_estimate:
                        anyOf:
                        - type: integer
                          minimum: 0
                          description: Estimated total matching items
                        - type: 'null'
                        description: Estimated total matching items
                    required:
                    - next_cursor
                required:
                - assets
                - meta
        '400':
