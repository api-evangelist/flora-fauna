                  created_at:
                    type: number
                  started_at:
                    type: number
                  completed_at:
                    type: number
                  error_code:
                    type: string
                    description: Machine-readable run error code
                    examples:
                    - provider_error
                  error_message:
                    type: string
                    description: Human-readable run error message
                    examples:
                    - The provider failed to complete the generation.
                  charged_cost:
                    type: number
                    minimum: 0
                    description: Cost charged in USD
                  outputs:
                    type: array
                    items:
                      type: object
                      properties:
                        output_id:
                          type: string
                          description: Run output identifier
                          examples:
                          - output_1
                        type:
                          enum:
                          - imageUrl
                          - videoUrl
                          - audioUrl
                          - text
