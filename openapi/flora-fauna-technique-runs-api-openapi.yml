  /techniques/{techniqueId}/runs/{runId}:
    get:
      operationId: getTechniqueRun
      summary: Get a technique run
      description: Returns status, progress, outputs, and error details for a technique run when it is accessible to the authenticated public API key.
      tags:
      - Technique Runs
      parameters:
      - name: techniqueId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          description: Technique identifier or slug
          examples:
          - art-directors-critique
          - auto-translate
          - book-drop
          - cctv-cam
          - character-lock
          - cinematic-movie-generator
          - color-mapping
          - color-transfer
          pattern: ^\S+$
        description: Technique identifier or slug
      - name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: ^run_\S+$
          description: Run identifier
          examples:
          - run_abc123
        description: Run identifier
      responses:
        '200':
          description: Technique run returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                    pattern: ^run_\S+$
                    description: Run identifier
                    examples:
                    - run_abc123
                  status:
                    enum:
                    - pending
                    - running
                    - completed
                    - failed
                    type: string
                  progress:
