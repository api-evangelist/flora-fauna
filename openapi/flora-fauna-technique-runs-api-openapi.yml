openapi: 3.2.0
info:
  title: Flora.ai Technique Runs API
  version: 1.6.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Nested technique run endpoints.
servers:
- url: https://app.flora.ai/api/v1
security:
- bearerAuth: []
tags:
- name: Technique Runs
  description: Nested technique run endpoints.
paths:
  /techniques/{techniqueId}/runs:
    post:
      operationId: startTechniqueRun
      summary: Start a technique run
      description: Starts a run for a specific technique using the backward-compatible nested route. Mutating public API requests support an optional Idempotency-Key header for client retries; duplicate keys within two hours return idempotency_duplicate.
      tags:
      - Technique Runs
      parameters:
      - name: techniqueId
        in: path
        required: true
        schema:
          type: string
          description: Technique identifier or slug
          examples:
          - art-directors-critique
          - auto-translate
          - book-drop
          - cctv-cam
          - character-lock
          - cinematic-movie-generator
          - color-mapping
          - color-transfer
          pattern: ^\S+$
        description: Technique identifier or slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: array
                  description: Technique inputs
                  minItems: 1
                  items:
                    type: object
                    required:
                    - id
                    - type
                    - value
                    properties:
                      id:
                        type: string
                        description: Technique input identifier
                      type:
                        type: string
                        enum:
                        - text
                        - imageUrl
                        - videoUrl
                        description: Technique input type
                      value:
                        type: string
                        description: Technique input value
                mode:
                  type: string
                  enum:
                  - async
                  - stream
                  description: Technique run execution mode
                callback_url:
                  type: string
                  format: uri
                  description: HTTPS callback URL for asynchronous run completion notifications
                idempotency_key:
                  type: string
                  description: Idempotency key for safely retrying requests
              required:
              - inputs
              - mode
              additionalProperties: false
      responses:
        '200':
          description: Technique run started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                    pattern: ^run_\S+$
                    description: Run identifier
                    examples:
                    - run_abc123
                  status:
                    enum:
                    - pending
                    - running
                    - completed
                    - failed
                    type: string
                  progress:
                    type: number
                  created_at:
                    type: number
                  started_at:
                    type: number
                  completed_at:
                    type: number
                  error_code:
                    type: string
                    description: Machine-readable run error code
                    examples:
                    - provider_error
                  error_message:
                    type: string
                    description: Human-readable run error message
                    examples:
                    - The provider failed to complete the generation.
                  charged_cost:
                    type: number
                    minimum: 0
                    description: Cost charged in USD
                  outputs:
                    type: array
                    items:
                      type: object
                      properties:
                        output_id:
                          type: string
                          description: Run output identifier
                          examples:
                          - output_1
                        type:
                          enum:
                          - imageUrl
                          - videoUrl
                          - audioUrl
                          - text
                          - documentUrl
                          type: string
                          description: Run output media type
                        url:
                          type: string
                          format: uri
                          description: Run output URL
                          examples:
                          - https://media.flora.ai/output.png
                      required:
                      - output_id
                      - type
                      - url
                  poll_url:
                    type: string
                    format: uri
                required:
                - run_id
                - status
                - progress
                - created_at
        '201':
          description: Technique run started.
          content:
            application/json:
              schema:
                type: object
