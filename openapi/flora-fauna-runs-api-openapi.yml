                          - slow-down-video
                          - duplicate-video
                          - greenscreen-video
                          - resize-video
                          - change-video-ar
                          - split-audio-from-video
                          - merge-audio-into-video
                      required:
                      - action_id
                    - type: 'null'
                  estimated_seconds:
                    anyOf:
                    - type: integer
                      minimum: 0
                    - type: 'null'
                  charged_cost:
                    type: number
                    minimum: 0
                    description: Cost charged in USD
                  poll_url:
                    anyOf:
                    - type: string
                      format: uri
                    - type: 'null'
                  project_id:
                    anyOf:
                    - type: string
                      pattern: ^prj_\S+$
                      description: Project identifier
                      examples:
