openapi: 3.2.0
info:
  title: Flora.ai Runs API
  version: 1.6.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Top-level run creation endpoints.
servers:
- url: https://app.flora.ai/api/v1
security:
- bearerAuth: []
tags:
- name: Runs
  description: Top-level run creation endpoints.
paths:
  /runs/{runId}:
    get:
      operationId: getRun
      summary: Get a run
      description: Returns status and completed output URLs for a public API run, including action runs started through POST /runs/action.
      tags:
      - Runs
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: ^run_\S+$
          description: Run identifier
          examples:
          - run_abc123
        description: Run identifier
      responses:
        '200':
          description: Run returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                    pattern: ^run_\S+$
                    description: Run identifier
                    examples:
                    - run_abc123
                  status:
                    enum:
                    - pending
                    - running
                    - completed
                    - failed
                    type: string
                  progress:
                    type: number
                  created_at:
                    type: number
                  started_at:
                    type: number
                  completed_at:
                    type: number
                  error_code:
                    type: string
                    description: Machine-readable run error code
                    examples:
                    - provider_error
                  error_message:
                    type: string
                    description: Human-readable run error message
                    examples:
                    - The provider failed to complete the generation.
                  charged_cost:
                    type: number
                    minimum: 0
                    description: Cost charged in USD
                  outputs:
                    type: array
                    items:
                      type: object
                      properties:
                        output_id:
                          type: string
                          description: Run output identifier
                          examples:
                          - output_1
                        type:
                          enum:
                          - imageUrl
                          - videoUrl
                          - audioUrl
                          - text
                          - documentUrl
                          type: string
                          description: Run output media type
                        url:
                          type: string
                          format: uri
                          description: Run output URL
                          examples:
                          - https://media.flora.ai/output.png
                      required:
                      - output_id
                      - type
                      - url
                  poll_url:
                    type: string
                    format: uri
                required:
                - run_id
                - status
                - progress
                - created_at
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                        - unauthorized
                        - invalid_api_key
                        - forbidden
                        - invalid_json
                        - input_validation_error
                        - not_found
                        - insufficient_credits
                        - idempotency_duplicate
                        - rate_limited
                        - unknown_error
                        examples:
                        - input_validation_error
                      message:
                        type: string
                        examples:
                        - 'name: Required'
                      fields:
                        type: array
                        items:
                          type: object
                          required:
                          - field
                          - message
                          additionalProperties: false
                          properties:
                            field:
                              type: string
                              examples:
                              - name
                            message:
                              type: string
                              examples:
                              - Required
              examples:
                input_validation_error:
                  summary: Invalid request
                  value:
                    error:
                      code: input_validation_error
                      message: 'prompt: Required'
                      fields:
                      - field: prompt
                        message: Required
