                          type: string
                          description: Technique input or output media type
                        description:
                          type: string
                          description: Technique input or output description
                          examples:
                          - Describe the desired image.
                        specified_aspect_ratio:
                          type: string
                          description: Required aspect ratio
                          examples:
                          - '1:1'
                        specified_duration:
                          type: number
                          description: Required duration in seconds
                      required:
                      - id
                      - name
                      - type
                required:
                - technique_id
                - name
                - run_cost
                - inputs
                - outputs
