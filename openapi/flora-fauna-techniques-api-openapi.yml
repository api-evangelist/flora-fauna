  /techniques/{techniqueId}:
    get:
      operationId: getTechnique
      summary: Get a technique
      description: Returns the public definition for one technique, including its input and output schema used to start runs.
      tags:
      - Techniques
      parameters:
      - name: techniqueId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          description: Technique identifier or slug
          examples:
          - art-directors-critique
          - auto-translate
          - book-drop
          - cctv-cam
          - character-lock
          - cinematic-movie-generator
          - color-mapping
          - color-transfer
          pattern: ^\S+$
        description: Technique identifier or slug
      responses:
        '200':
          description: Technique returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  technique_id:
                    type: string
                    pattern: ^tech_\S+$
                    description: Technique identifier
                    examples:
                    - tech_abcd1234
                  name:
                    type: string
                    description: Technique name
                    examples:
                    - Editorial Image Grid
                  description:
                    type: string
                    description: Technique description
                    examples:
                    - Generate a cohesive editorial image grid.
                  run_cost:
                    type: number
                    minimum: 0
                    description: Cost per run in USD
                  inputs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Technique input or output identifier
                          examples:
                          - prompt
                        name:
                          type: string
                          description: Technique input or output display name
                          examples:
                          - Prompt
                        type:
                          enum:
                          - imageUrl
                          - videoUrl
                          - audioUrl
                          - text
                          - documentUrl
                          type: string
                          description: Technique input or output media type
                        description:
                          type: string
                          description: Technique input or output description
                          examples:
                          - Describe the desired image.
                        specified_aspect_ratio:
                          type: string
                          description: Required aspect ratio
                          examples:
                          - '1:1'
                        specified_duration:
                          type: number
                          description: Required duration in seconds
                      required:
                      - id
                      - name
                      - type
                  outputs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Technique input or output identifier
                          examples:
                          - prompt
                        name:
                          type: string
                          description: Technique input or output display name
                          examples:
                          - Prompt
